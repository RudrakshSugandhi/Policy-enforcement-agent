[project]
name = "reap-policy-agent-mcp"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["tools", "schemas"]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
